name: IVG Preis-Tracker

on:
  push:
    paths:
      - 'auktionen.txt'    # Neue Links beim Speichern sofort einmal einlesen
  schedule:
    - cron: '*/5 * * * *'  # Taktgeber für 12:00 Uhr & die letzten 30 Min. vor Ende
  workflow_dispatch:       # Manueller Start zum Testen

permissions:
  contents: write

concurrency:
  group: ivg-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zeitplan prüfen
        id: check
        run: python tracker.py --check

      - name: Playwright installieren
        if: steps.check.outputs.run_browser == 'true'
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Fällige Auktionen abfragen
        if: steps.check.outputs.run_browser == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Ergebnisse speichern
        if: steps.check.outputs.run_browser == 'true'
        run: |
          git config user.name "Preis-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add preise.csv status.json
          git commit -m "Preis-Update $(date +'%Y-%m-%d %H:%M')" || exit 0
          git push
